<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- background -->
  <rect width="32" height="32" rx="6" fill="#15101C"/>
  <!-- neon pink glow layer -->
  <rect width="32" height="32" rx="6" fill="none" stroke="#FF2E88" stroke-width="1.5" opacity="0.6"/>
  <!-- diamond -->
  <polygon points="16,5 27,16 16,27 5,16" fill="#FF2E88" opacity="0.15"/>
  <polygon points="16,5 27,16 16,27 5,16" fill="none" stroke="#FF2E88" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- inner diamond highlight -->
  <polygon points="16,10 22,16 16,22 10,16" fill="#FF2E88" opacity="0.7"/>
</svg>
